<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JENDORA · Admin</title><script src="config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#171717;font:14px Arial,sans-serif}.top{background:#111;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.logo{font:26px Georgia;letter-spacing:5px}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.panel{background:white;border:1px solid #e5e5e5;padding:22px;margin:16px 0;border-radius:12px}.muted{color:#777}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn{border:0;background:#111;color:#fff;padding:11px 16px;cursor:pointer;border-radius:6px}.btn.light{background:#eee;color:#111}.btn.danger{background:#a22}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#666}.field input,.field textarea,.field select{padding:12px;border:1px solid #ddd;width:100%;font:inherit}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #eee;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f3f3f1;padding:16px}.stat b{display:block;font:28px Georgia;margin-top:8px}.notice{padding:12px;background:#fff6df;color:#765a18;line-height:1.5}.hidden{display:none!important}@media(max-width:650px){.grid,.stats{grid-template-columns:1fr 1fr}.top{padding:16px}.logo{font-size:20px}}
</style></head><body><header class="top"><div class="logo">JENDORA <small style="font:10px Arial;letter-spacing:2px">ADMIN</small></div><a href="index.html" style="color:white">← Storefront</a></header><main class="wrap"><section class="panel" id="login"><h1>Admin sign in</h1><p class="muted">Demo access is limited to the configured Gmail address.</p><div class="field"><label>Admin Gmail</label><input id="adminEmail" type="email" placeholder="admin@gmail.com"></div><button class="btn" onclick="signIn()">Continue</button><p class="notice">Demo-only gate: this static HTML cannot securely authenticate an admin. Production access must use Google OAuth and server-side authorization.</p></section><section id="dashboard" class="hidden"><div class="panel"><h1>Store dashboard</h1><p class="muted" id="signedAs"></p><div class="stats" id="stats"></div><div class="tabs"><button class="btn" onclick="tab('products')">Products</button><button class="btn" onclick="tab('orders')">Orders & bills</button><button class="btn" onclick="tab('settings')">Store settings</button><button class="btn light" onclick="signOut()">Sign out</button></div><div id="content"></div></div></section></main>
<script>
const $=id=>document.getElementById(id), money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
let products=JSON.parse(localStorage.getItem('jd_products')||'null')||[],orders=JSON.parse(localStorage.getItem('jd_orders')||'[]');
function save(){localStorage.setItem('jd_products',JSON.stringify(products));localStorage.setItem('jd_orders',JSON.stringify(orders));}
function signed(){return sessionStorage.getItem('jd_admin')==='yes'}
function signIn(){let email=$('adminEmail').value.trim().toLowerCase();if(email!==String(JENDORA_CONFIG.adminEmail).toLowerCase()){alert('Access denied');return}sessionStorage.setItem('jd_admin','yes');boot()}
function signOut(){sessionStorage.removeItem('jd_admin');location.reload()}
function boot(){if(!signed())return;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('signedAs').textContent='Signed in as '+JENDORA_CONFIG.adminEmail;refreshStats();tab('products')}
function refreshStats(){$('stats').innerHTML=[['PRODUCTS',products.length],['ORDERS',orders.length],['REVENUE',money(orders.reduce((s,o)=>s+(+o.total||0),0))],['PAID INVOICES',orders.filter(o=>o.invoiceNo).length]].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('')}
function key(p){let sku=String(p.sku||'').trim().toLowerCase();return sku?'sku:'+sku:'name:'+String(p.brand||'').trim().toLowerCase().replace(/\s+/g,' ')+'|'+String(p.title||'').trim().toLowerCase().replace(/\s+/g,' ')}
function tab(name){if(!signed())return;let c=$('content');if(name==='products'){c.innerHTML=`<h2>Products (${products.length})</h2><form id="productForm" onsubmit="saveProduct(event)"><input type="hidden" id="editId"><div class="grid"><div class="field"><label>Product name *</label><input id="title" required></div><div class="field"><label>Brand</label><input id="brand" placeholder="Brand name"></div><div class="field"><label>SKU (unique)</label><input id="sku" placeholder="Unique product SKU"></div><div class="field"><label>Category</label><input id="category" placeholder="Women / Men / Shoes"></div><div class="field"><label>Price ₹ *</label><input id="price" type="number" min="1" required></div><div class="field"><label>Image URL</label><input id="image" type="url"></div></div><div class="field"><label>Description</label><textarea id="desc" rows="3"></textarea></div><button class="btn" type="submit">Save product</button> <button class="btn light" type="button" onclick="resetForm()">Clear</button></form><hr><div class="field"><label>Import Shopify / Jendora CSV</label><input type="file" accept=".csv,text/csv" onchange="importCSV(this.files[0])"></div><div id="productRows"></div>`;drawProducts()}
if(name==='orders'){c.innerHTML='<h2>Orders & invoices</h2>'+ (orders.map(o=>`<div class="row"><div><b>${o.id}</b><br><small>${o.date||''} · ${money(o.total)} · ${o.paymentStatus||'Payment pending'}</small></div><div><select onchange="status('${o.id}',this.value)">${['Order placed','Confirmed','Packed','Shipped','Out for delivery','Delivered','Cancelled'].map(v=>`<option ${v===o.status?'selected':''}>${v}</option>`).join('')}</select> ${o.invoiceNo?`<button class="btn light" onclick="invoice('${o.id}')">Print bill</button>`:'<span class="muted">Invoice after payment confirmation</span>'}</div></div>`).join('')||'<p>No orders yet.</p>')}
if(name==='settings'){c.innerHTML=`<h2>Store settings</h2><div class="notice">These are public store settings. Do not enter Shopify admin passwords, private API tokens, payment secrets or database keys here.</div><div class="grid"><div class="field"><label>GST %</label><input id="gst" type="number" value="${localStorage.getItem('jd_gst')||JENDORA_CONFIG.gstRate}"></div><div class="field"><label>Shipping fee ₹</label><input id="ship" type="number" value="${localStorage.getItem('jd_ship')||JENDORA_CONFIG.shippingFee}"></div><div class="field"><label>Free shipping threshold ₹</label><input id="free" type="number" value="${localStorage.getItem('jd_free_ship')||JENDORA_CONFIG.freeShippingThreshold}"></div></div><button class="btn" onclick="localStorage.setItem('jd_gst',$('gst').value);localStorage.setItem('jd_ship',$('ship').value);localStorage.setItem('jd_free_ship',$('free').value);alert('Settings saved')">Save settings</button>`}}
function drawProducts(){let el=$('productRows');if(!el)return;el.innerHTML=products.map(p=>`<div class="row"><div><b>${esc(p.title)}</b><br><small>${esc(p.brand||'')} · SKU: ${esc(p.sku||'—')} · ${money(p.price)}</small></div><div><button class="btn light" onclick="edit('${p.id}')">Edit</button> <button class="btn danger" onclick="removeProduct('${p.id}')">Delete</button></div></div>`).join('')||'<p>No products yet.</p>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function resetForm(){['editId','title','brand','sku','category','price','image','desc'].forEach(id=>$(id).value='')}
function saveProduct(e){e.preventDefault();let p={id:$('editId').value||'JD-P-'+Date.now(),title:$('title').value.trim(),brand:$('brand').value.trim(),sku:$('sku').value.trim(),category:$('category').value.trim()||'Other',price:+$('price').value,image:$('image').value.trim(),desc:$('desc').value.trim(),tag:'New'};let duplicate=products.find(x=>key(x)===key(p)&&x.id!==p.id);if(duplicate){alert('Duplicate product blocked. Same SKU or same Brand + Product name already exists. Edit the existing item or use a unique SKU for a genuinely different variant.');return}let i=products.findIndex(x=>x.id===p.id);if(i>=0)products[i]={...products[i],...p};else products.unshift(p);save();refreshStats();resetForm();drawProducts();alert('Product saved')}
function edit(id){let p=products.find(x=>x.id===id);if(!p)return;['id','title','brand','sku','category','price','image','desc'].forEach(k=>{let id=k==='id'?'editId':k;$(id).value=p[k]||''});window.scrollTo({top:0,behavior:'smooth'})}
function removeProduct(id){if(!confirm('Delete this product?'))return;products=products.filter(p=>p.id!==id);save();refreshStats();drawProducts()}
function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(Boolean))rows.push(row);return rows}
function importCSV(file){if(!file)return;let r=new FileReader();r.onload=()=>{let rows=parseCSV(r.result),h=(rows.shift()||[]).map(x=>x.trim().toLowerCase()),ix=(...names)=>{for(let n of names){let i=h.indexOf(n);if(i>=0)return i}return -1},added=0,skipped=0,seen=new Set(products.map(key));for(let row of rows){let p={id:'JD-IMP-'+Date.now()+'-'+added,title:row[ix('title','product title')]||'',brand:row[ix('brand','vendor')]||'',sku:row[ix('sku','variant sku')]||'',category:row[ix('category','type')]||'Other',price:+(row[ix('price','variant price')]||0),image:row[ix('image','image src')]||'',desc:row[ix('description','body (html)')]||''};if(!p.title||!p.price){skipped++;continue}let k=key(p);if(seen.has(k)){skipped++;continue}seen.add(k);products.push(p);added++}save();refreshStats();drawProducts();alert(`${added} products added. ${skipped} duplicates/invalid rows skipped.`)};r.readAsText(file)}
function status(id,v){let o=orders.find(x=>x.id===id);if(o)o.status=v;save()}
function invoice(id){let o=orders.find(x=>x.id===id);if(!o||!o.invoiceNo||!String(o.paymentStatus).startsWith('PAID'))return alert('No confirmed payment invoice exists for this order.');let lines=o.items.map(x=>`<tr><td>${esc(x.title)}</td><td>${x.qty}</td><td>${money(x.price*x.qty)}</td></tr>`).join(''),w=window.open('','_blank');if(!w)return alert('Please allow pop-ups');w.document.write(`<h1>JENDORA</h1><h2>Invoice ${o.invoiceNo}</h2><p>Order ${o.id} · ${o.date}</p><p>${esc(o.customer.first)} ${esc(o.customer.last)}<br>${esc(o.customer.address)}, ${esc(o.customer.city)} ${esc(o.customer.pin)}</p><table border="1" cellpadding="10" cellspacing="0"><tr><th>Product</th><th>Qty</th><th>Amount</th></tr>${lines}</table><h3>Subtotal ${money(o.subtotal)} · GST ${money(o.gst)} · Shipping ${money(o.shipping)} · Total ${money(o.total)}</h3><script>onload=()=>print()<\/script>`);w.document.close()}
if(signed())boot();
</script></body></html>
