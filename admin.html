<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JENDORA · Admin Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f1;color:#20211d;font:14px/1.5 Arial}.top{background:#252720;color:white;padding:18px 4%;display:flex;justify-content:space-between;align-items:center}.logo{font:26px Georgia;letter-spacing:4px}.wrap{max-width:1200px;margin:30px auto;padding:0 20px}.panel{background:#fff;border:1px solid #e9e9e3;border-radius:15px;padding:24px;margin-bottom:20px}.muted{color:#777}.btn{border:0;border-radius:25px;background:#292b25;color:#fff;padding:11px 18px;cursor:pointer;margin:4px}.btn.light{background:#eee;color:#222}.btn.danger{background:#9e3838}.field{display:grid;gap:6px;margin:12px 0}.field input,.field textarea,.field select{border:1px solid #ddd;border-radius:8px;padding:11px;width:100%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:20px 0}.tabs button{background:#efefe9;color:#252720}.tabs button.active{background:#292b25;color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:13px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f5f5f1;border-radius:10px;padding:15px;color:#777}.stat b{display:block;color:#222;font:24px Georgia;margin-top:5px}.hidden{display:none}.notice{background:#f6f1e6;padding:12px;border-radius:8px;color:#665b3e}.status{padding:5px 9px;border-radius:20px;background:#f1f1eb;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><div class="logo">JENDORA <small style="font:10px Arial;letter-spacing:2px">ADMIN STUDIO</small></div><a href="index.html" style="color:white">← Storefront</a></header><main class="wrap"><section class="panel" id="login"><h1>Admin sign in</h1><p class="muted">Secure Google authentication. Access is granted only to accounts registered in Supabase admin_users.</p><button class="btn" onclick="login()">Continue with Google</button><p id="loginMsg" class="notice">Configure Google OAuth in Supabase Auth before signing in.</p></section><section id="dash" class="hidden"><div class="panel"><div class="row"><div><h1>Store dashboard</h1><p id="who" class="muted"></p></div><button class="btn light" onclick="logout()">Sign out</button></div><div class="stats" id="stats"></div><div class="tabs" id="tabs"><button class="btn active" data-tab="products" onclick="tab('products')">Products</button><button class="btn" data-tab="categories" onclick="tab('categories')">Categories</button><button class="btn" data-tab="banners" onclick="tab('banners')">Banners</button><button class="btn" data-tab="orders" onclick="tab('orders')">Orders</button><button class="btn" data-tab="settings" onclick="tab('settings')">Settings</button></div><div id="content"></div></div></section></main><script>
const $=id=>document.getElementById(id),db=window.JENDORA_DB;let allProducts=[],allOrders=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});function msg(s){let e=document.createElement('div');e.className='notice';e.textContent=s;$('content').prepend(e);setTimeout(()=>e.remove(),4000)}function err(e){console.error(e);alert(e.message||'Operation failed')}async function login(){try{await db.googleLogin()}catch(e){err(e)}}async function logout(){try{await db.signOut();location.reload()}catch(e){err(e)}}async function boot(){if(!db.ready()){$('loginMsg').textContent='Add Supabase Project URL and publishable/anon key to config.js.';return}try{let u=await db.user();if(!u)return;let ok=await db.isAdmin();if(!ok){$('loginMsg').textContent='This Google account is not authorized as an admin. Add its user ID to public.admin_users in Supabase SQL Editor.';return}$('login').classList.add('hidden');$('dash').classList.remove('hidden');$('who').textContent=u.email;await refresh();tab('products')}catch(e){$('loginMsg').textContent=e.message}}async function refresh(){[allProducts,allOrders]=await Promise.all([db.adminProducts(),db.adminOrders()]);let paid=allOrders.filter(o=>o.payment_status==='PAID');$('stats').innerHTML=[['PRODUCTS',allProducts.length],['ORDERS',allOrders.length],['PAID REVENUE',money(paid.reduce((a,o)=>a+Number(o.total_paise||0),0)/100)],['PENDING',allOrders.filter(o=>o.payment_status==='PENDING').length]].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('')}
function tab(t){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));({products:productsTab,categories:categoriesTab,banners:bannersTab,orders:ordersTab,settings:settingsTab})[t]().catch(err)}
async function productsTab(){await refresh();$('content').innerHTML=`<h2>Products · ${allProducts.length}</h2><form id="pf" onsubmit="saveProduct(event)"><input type="hidden" id="pid"><div class="grid"><div class="field"><label>Product title *</label><input id="title" required></div><div class="field"><label>Brand</label><input id="brand"></div><div class="field"><label>SKU (unique)</label><input id="sku"></div><div class="field"><label>Category</label><input id="category" placeholder="Women / Men / Shoes"></div><div class="field"><label>Price ₹ *</label><input id="price" type="number" min="0" step="0.01" required></div><div class="field"><label>Compare at ₹</label><input id="compare" type="number" min="0" step="0.01"></div><div class="field"><label>Stock</label><input id="stock" type="number" min="0" value="0"></div><div class="field"><label>Product image file</label><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="field"><label>Or image URL</label><input id="image" type="url"></div><div class="field"><label>Sizes (comma separated)</label><input id="sizes" placeholder="S, M, L, XL"></div><div class="field"><label>Tag</label><input id="tag" placeholder="New / Sale"></div><div class="field"><label>Visibility</label><select id="active"><option value="true">Active</option><option value="false">Hidden</option></select></div></div><div class="field"><label>Description</label><textarea id="description" rows="3"></textarea></div><label><input id="featured" type="checkbox"> Featured product</label><br><button class="btn">Save product</button><button type="button" class="btn light" onclick="resetProduct()">Clear</button></form><hr><div class="field"><label>Import CSV (Shopify-compatible basic columns: Title, Vendor, Variant SKU, Variant Price, Image Src, Type, Body (HTML))</label><input type="file" accept=".csv,text/csv" onchange="importCSV(this.files[0])"></div><div id="productRows"></div>`;drawProducts()}
function drawProducts(){ $('productRows').innerHTML=allProducts.map(p=>`<div class="row"><div><b>${esc(p.title)}</b><div class="muted">${esc(p.brand||'')} · ${esc(p.sku||'No SKU')} · ${money(p.price_paise/100)} · Stock ${p.stock} · ${p.active?'Active':'Hidden'}</div></div><div><button class="btn light" onclick="editProduct('${p.id}')">Edit</button><button class="btn danger" onclick="deleteProduct('${p.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No products in Supabase yet.</p>'}
function resetProduct(){$('pf').reset();$('pid').value='';$('stock').value=0}function editProduct(id){let p=allProducts.find(x=>x.id===id);if(!p)return;[['pid','id'],['title','title'],['brand','brand'],['sku','sku'],['category','category'],['price','price_paise'],['compare','compare_at_price_paise'],['stock','stock'],['image','image_url'],['sizes','sizes'],['tag','tag'],['description','description']].forEach(([a,b])=>$(a).value=b==='price_paise'||b==='compare_at_price_paise'?(p[b]||0)/100:b==='sizes'?(p[b]||[]).join(', '):(p[b]??''));$('active').value=String(p.active);$('featured').checked=!!p.featured;window.scrollTo({top:0,behavior:'smooth'})}
async function saveProduct(e){e.preventDefault();try{let id=$('pid').value,sku=$('sku').value.trim(),title=$('title').value.trim(),brand=$('brand').value.trim();let duplicate=allProducts.find(p=>p.id!==id&&((sku&&p.sku&&p.sku.toLowerCase()===sku.toLowerCase())||(!sku&&!p.sku&&(p.title||'').toLowerCase()===title.toLowerCase()&&(p.brand||'').toLowerCase()===brand.toLowerCase())));if(duplicate)throw Error('Duplicate product blocked: SKU or Brand + Product title already exists.');let image=$('image').value.trim(),file=$('imageFile').files[0];if(file)image=await db.upload(file);await db.saveProduct({id,title,brand,sku,category:$('category').value.trim()||'Other',price:$('price').value,compare:$('compare').value,stock:$('stock').value,image_url:image,sizes:$('sizes').value.split(',').map(x=>x.trim()).filter(Boolean),tag:$('tag').value,description:$('description').value,active:$('active').value==='true',featured:$('featured').checked});await productsTab();msg('Product saved to Supabase.')}catch(e){err(e)}}async function deleteProduct(id){if(!confirm('Delete this product from Supabase?'))return;try{await db.deleteProduct(id);await productsTab()}catch(e){err(e)}}
async function categoriesTab(){let rows=await db.adminCategories();$('content').innerHTML=`<h2>Categories</h2><form onsubmit="saveCategory(event)"><input type="hidden" id="cid"><div class="grid"><div class="field"><label>Name</label><input id="cname" required></div><div class="field"><label>Slug</label><input id="cslug" required></div><div class="field"><label>Image URL</label><input id="cimage"></div></div><button class="btn">Save category</button></form>${rows.map(c=>`<div class="row"><b>${esc(c.name)}</b><span>${c.active?'Active':'Hidden'}</span><button class="btn light" onclick="editCategory('${c.id}','${esc(c.name)}','${esc(c.slug)}','${esc(c.image_url||'')}')">Edit</button></div>`).join('')||'<p>No categories yet.</p>'}`}function editCategory(id,n,s,i){$('cid').value=id;$('cname').value=n;$('cslug').value=s;$('cimage').value=i}async function saveCategory(e){e.preventDefault();try{await db.saveCategory({id:$('cid').value||null,name:$('cname').value,slug:$('cslug').value,image_url:$('cimage').value});await categoriesTab();msg('Category saved.')}catch(e){err(e)}}
async function bannersTab(){let rows=await db.adminBanners();$('content').innerHTML=`<h2>Homepage banners</h2><form onsubmit="saveBanner(event)"><input type="hidden" id="bid"><div class="grid"><div class="field"><label>Heading</label><input id="btitle" required></div><div class="field"><label>Subtitle</label><input id="bsubtitle"></div><div class="field"><label>Image URL</label><input id="bimage"></div><div class="field"><label>Link URL</label><input id="blink"></div><div class="field"><label>Sort order</label><input id="bsort" type="number" value="0"></div><div class="field"><label>Status</label><select id="bactive"><option value="true">Active</option><option value="false">Hidden</option></select></div></div><button class="btn">Save banner</button></form>${rows.map(b=>`<div class="row"><b>${esc(b.title)}</b><span>${b.active?'Active':'Hidden'}</span><button class="btn light" onclick="editBanner('${b.id}','${esc(b.title)}','${esc(b.subtitle||'')}','${esc(b.image_url||'')}','${esc(b.link_url||'')}',${b.sort_order},${b.active})">Edit</button></div>`).join('')||'<p>No banners yet. The storefront will show its designed default hero.</p>'}`}function editBanner(id,t,s,i,l,o,a){$('bid').value=id;$('btitle').value=t;$('bsubtitle').value=s;$('bimage').value=i;$('blink').value=l;$('bsort').value=o;$('bactive').value=String(a)}async function saveBanner(e){e.preventDefault();try{await db.saveBanner({id:$('bid').value||null,title:$('btitle').value,subtitle:$('bsubtitle').value,image_url:$('bimage').value,link_url:$('blink').value,sort_order:$('bsort').value,active:$('bactive').value==='true'});await bannersTab();msg('Banner saved.')}catch(e){err(e)}}
async function ordersTab(){await refresh();$('content').innerHTML=`<h2>Orders</h2><p class="notice">Payment status is controlled by verified payment integration, not this dashboard. Do not manually mark orders paid here.</p>${allOrders.map(o=>`<div class="row"><div><b>${esc(o.order_number)}</b><div class="muted">${esc(o.customer_name)} · ${new Date(o.created_at).toLocaleString()} · ${money(o.total_paise/100)} · ${esc(o.payment_status)}</div><small>${(o.order_items||[]).map(i=>esc(i.product_title)+' × '+i.quantity).join(' · ')}</small></div><select onchange="setStatus('${o.id}',this.value)">${['Order placed','Confirmed','Packed','Shipped','Out for delivery','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p>No orders yet.</p>'}`}async function setStatus(id,s){try{await db.updateOrder(id,s);msg('Order status updated.')}catch(e){err(e)}}
async function settingsTab(){let s=await db.settings();const val=(k,d)=>{let x=s[k];return x===undefined?d:String(x).replace(/^"|"$/g,'')};$('content').innerHTML=`<h2>Store settings</h2><p class="muted">Values are saved in Supabase and shared with the storefront. Tax/shipping rules used in checkout are calculated by the database RPC.</p><form onsubmit="saveSettings(event)"><div class="grid"><div class="field"><label>GST rate %</label><input id="gst" type="number" min="0" step="0.01" value="${esc(val('gst_rate','18'))}"></div><div class="field"><label>Shipping fee ₹</label><input id="ship" type="number" min="0" step="0.01" value="${Number(val('shipping_fee_paise','9900'))/100}"></div><div class="field"><label>Free shipping threshold ₹</label><input id="free" type="number" min="0" step="0.01" value="${Number(val('free_shipping_threshold_paise','199900'))/100}"></div><div class="field"><label>Announcement bar</label><input id="announcement" value="${esc(val('announcement',''))}"></div></div><button class="btn">Save settings</button></form>`}async function saveSettings(e){e.preventDefault();try{await Promise.all([db.saveSetting('gst_rate',Number($('gst').value)),db.saveSetting('shipping_fee_paise',Math.round(Number($('ship').value)*100)),db.saveSetting('free_shipping_threshold_paise',Math.round(Number($('free').value)*100)),db.saveSetting('announcement',$('announcement').value)]);msg('Settings saved to Supabase.')}catch(e){err(e)}}
function parseCSV(s){let rows=[],r=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'&&q&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;r.push(v);if(r.some(x=>x))rows.push(r);r=[];v=''}else v+=c}r.push(v);if(r.some(x=>x))rows.push(r);return rows}async function importCSV(file){if(!file)return;try{let rows=parseCSV(await file.text()),h=rows.shift().map(x=>x.trim().toLowerCase()),ix=(...names)=>{for(let n of names){let i=h.indexOf(n);if(i>=0)return i}return -1};let added=0,skipped=0;for(let r of rows){let title=r[ix('title','product title')];let price=Number(r[ix('variant price','price')]);if(!title||!price){skipped++;continue}let sku=r[ix('variant sku','sku')]||'',brand=r[ix('vendor','brand')]||'',duplicate=allProducts.some(p=>(sku&&p.sku===sku)||(!sku&&!p.sku&&p.title.toLowerCase()===title.toLowerCase()&&(p.brand||'').toLowerCase()===brand.toLowerCase()));if(duplicate){skipped++;continue}try{await db.saveProduct({title,brand,sku,category:r[ix('type','category')]||'Other',price,description:r[ix('body (html)','description')]||'',image_url:r[ix('image src','image')]||'',stock:0,active:true});added++}catch(e){skipped++}}await productsTab();msg(`${added} imported · ${skipped} skipped (duplicates/invalid rows).`)}catch(e){err(e)}}boot();
</script></body></html>
