<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopify Sync</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<style>body{font-family:Inter,Arial,sans-serif;max-width:1000px;margin:30px auto;padding:0 16px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}button{background:#000;color:#fff;border:0;border-radius:99px;padding:12px 24px;cursor:pointer;margin:0 8px 16px 0}</style></head><body>
<h1>Shopify Products</h1><button onclick="load()">Fetch from Shopify</button><button onclick="imp()">Import all to Supabase</button><p id="m"></p><div class="g" id="g"></div>
<script>
const C=CONFIG;let items=[];const m=t=>document.getElementById('m').textContent=t;
async function load(){m('Loading…');const q=`{products(first:50){edges{node{title productType images(first:1){edges{node{url}}} variants(first:1){edges{node{price{amount} compareAtPrice{amount}}}}}}}}`;
 // Worker proxy use karo to token hide rahe; warna direct Storefront API
 const url=C.WORKER_URL.includes('your-worker')?`https://${C.SHOPIFY_DOMAIN}/api/2024-10/graphql.json`:C.WORKER_URL+'/shopify';
 try{const r=await(await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Shopify-Storefront-Access-Token':C.SHOPIFY_STOREFRONT_TOKEN},body:JSON.stringify({query:q})})).json();
 items=r.data.products.edges.map(e=>{const n=e.node,v=n.variants.edges[0].node;return{title:n.title,price:+v.price.amount,mrp:+(v.compareAtPrice?.amount||v.price.amount),image:n.images.edges[0]?.node.url||'',category:n.productType||'Casual'}});
 document.getElementById('g').innerHTML=items.map(p=>`<div><img src="${p.image}"><b>${p.title.replace(/</g,'&lt;')}</b><br>₹${p.price}</div>`).join('');m(items.length+' products mile')}catch(e){m('Error: keys/domain check karo')}}
async function imp(){if(!items.length)return m('Pehle fetch karo');const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);const{error}=await sb.from('products').insert(items);m(error?'Import error (admin login chahiye): '+error.message:'Imported ✔')}
</script></body></html>
