</style></head><body>
<div class="announcement">Complimentary shipping on orders over ₹1,999 · Thoughtfully selected, always</div>
<header class="shell header"><a href="#home" class="logo">JENDORA<small>THE ART OF EVERYDAY</small></a><nav class="nav"><a href="#shop">NEW ARRIVALS</a><a href="#shop?cat=Women">WOMEN</a><a href="#shop?cat=Men">MEN</a><a href="#shop?cat=Shoes">SHOES</a><a href="#shop?cat=Bags">BAGS</a></nav><div class="head-actions"><button class="round" onclick="go('account')">Account</button><button class="round" onclick="location.href='admin.html'">Admin</button><button class="round" onclick="go('cart')">Bag <b id="bagcount">0</b></button></div></header>

<script>
const demoProducts=[
{id:'p1',title:'The Linen Overshirt',category:'Women',price:2490,old:3290,icon:'✧',tag:'Bestseller',desc:'An easy, beautifully considered layer in breathable linen-blend fabric. Made for slow mornings and long afternoons.',sizes:['XS','S','M','L','XL'],color:'Natural Ivory'},
{id:'p2',title:'Sculpted Everyday Tote',category:'Bags',price:3190,icon:'◒',tag:'New season',desc:'A softly structured carryall with a clean silhouette and considered proportions.',sizes:['One size'],color:'Warm Taupe'},
{id:'p3',title:'The Court Sneaker',category:'Shoes',price:3890,icon:'⌁',tag:'Essential',desc:'A timeless low-profile sneaker designed for everyday comfort and understated style.',sizes:['6','7','8','9','10'],color:'Chalk'},
{id:'p4',title:'Soft Form Knit Polo',category:'Men',price:2190,icon:'◇',tag:'Jendora edit',desc:'A refined knit polo with a relaxed fit and soft hand-feel.',sizes:['S','M','L','XL'],color:'Stone'},
{id:'p5',title:'Petal Gold Earrings',category:'Accessories',price:1290,icon:'◌',tag:'Limited',desc:'A delicate sculptural accent, designed to move effortlessly from day to evening.',sizes:['One size'],color:'Champagne Gold'},
{id:'p6',title:'Relaxed Cotton Set',category:'Women',price:3490,icon:'✧',tag:'New',desc:'A relaxed two-piece cotton set for effortless everyday dressing.',sizes:['XS','S','M','L'],color:'Oat'},
{id:'p7',title:'The Fold Wallet',category:'Accessories',price:1590,icon:'▱',tag:'Everyday',desc:'A compact wallet with considered storage and a clean finish.',sizes:['One size'],color:'Cocoa'},
{id:'p8',title:'Minimal Leather Slides',category:'Shoes',price:2290,icon:'⌁',tag:'Popular',desc:'Minimal slides with a comfortable footbed and timeless shape.',sizes:['6','7','8','9','10'],color:'Sand'}
];
let products=JSON.parse(localStorage.getItem('jd_products')||'null')||demoProducts,cart=JSON.parse(localStorage.getItem('jd_cart')||'[]'),orders=JSON.parse(localStorage.getItem('jd_orders')||'[]'),currentSize='',currentProduct=null,category='All',customer=JSON.parse(localStorage.getItem('jd_customer')||'null');
const $=id=>document.getElementById(id),rs=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function save(){localStorage.setItem('jd_products',JSON.stringify(products));localStorage.setItem('jd_cart',JSON.stringify(cart));localStorage.setItem('jd_orders',JSON.stringify(orders));localStorage.setItem('jd_customer',JSON.stringify(customer));$('bagcount').textContent=cart.reduce((s,x)=>s+x.qty,0)}
function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function go(page,arg){location.hash=page+(arg?'?'+encodeURIComponent(arg):'')}
function card(p){return `<article class="card" onclick="go('product','${p.id}')"><div class="photo"><span>${p.icon||'✧'}</span><span class="tag">${p.tag||p.category}</span><button class="wish" onclick="event.stopPropagation();toast('Saved to wishlist')">♡</button></div><div class="card-info"><small>${p.category||'Collection'}</small><h3>${esc(p.title)}</h3><span class="price">${rs(p.price)}</span> ${p.old?`<del class="muted">${rs(p.old)}</del>`:''}<div class="card-actions"><span class="muted">★ 4.8 · Customer favorite</span><button class="textbtn" onclick="event.stopPropagation();add('${p.id}')">Add to bag +</button></div></div></article>`}
function home(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">The new season · Collection 01</div><h1>Quiet luxury.<br>Everyday ease.</h1><p>Thoughtfully selected pieces, timeless details, and a little something special for the everyday.</p><button class="btn" onclick="go('shop')">Discover the collection ↗</button></div><div class="hero-art">J.</div></section><section class="section"><div class="secthead"><div><div class="eyebrow">Explore the edit</div><h2>Find your expression</h2></div><span class="muted">Considered essentials</span></div><div class="categories">${['All','Women','Men','Shoes','Bags','Accessories'].map(c=>`<button class="cat" onclick="category='${c}';go('shop')">${c}</button>`).join('')}</div></section><section class="section"><div class="secthead"><div><div class="eyebrow">Curated for you</div><h2>New & noteworthy</h2></div><button class="textbtn" onclick="go('shop')">View all pieces ↗</button></div><div class="grid">${products.slice(0,4).map(card).join('')}</div></section><section class="promo"><div><div class="eyebrow">A little more, for members</div><h2>Subscribe & save 10%</h2><span class="muted">Enjoy member-only benefits on considered essentials.</span></div><button class="btn" onclick="go('account')">Discover membership ↗</button></section><section class="section"><div class="secthead"><div><div class="eyebrow">The Jendora selection</div><h2>Made for every day</h2></div><button class="textbtn" onclick="go('shop')">Shop all ↗</button></div><div class="grid">${products.slice(4,8).map(card).join('')}</div></section>`}
function shop(){let list=products.filter(p=>category==='All'||p.category===category);return `<div class="page-title"><div class="crumb">Jendora / Collections</div><h1>The collection</h1><p class="muted">A considered edit of pieces to keep close.</p></div><div class="categories">${['All','Women','Men','Shoes','Bags','Accessories'].map(c=>`<button class="cat ${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div><section class="section"><div class="secthead"><h2>${category==='All'?'All pieces':category}</h2><span class="muted">${list.length} pieces</span></div><div class="grid">${list.map(card).join('')||'<p>No products found in this collection.</p>'}</div></section>`}
function productPage(id){let p=products.find(x=>x.id===id)||products[0];currentProduct=p;currentSize='';return `<div class="crumb" style="padding-top:30px"><a href="#shop">Collections</a> / ${esc(p.category)}</div><section class="detail"><div class="gallery"><div>${p.icon||'✧'}</div><div>${p.icon||'✧'}</div><div>${p.icon||'✧'}</div></div><div class="buybox"><div class="eyebrow">${esc(p.category||'Jendora collection')}</div><h1>${esc(p.title)}</h1><div class="price">${rs(p.price)} ${p.old?`<del class="muted">${rs(p.old)}</del>`:''}</div><p class="muted">★ 4.8 · Loved by Jendora customers</p><p>${esc(p.desc||'Thoughtfully selected for everyday living. Refined details and considered design.')}</p><div class="field"><label>Color · ${esc(p.color||'As shown')}</label><div class="size-row"><button class="size selected">${esc(p.color||'As shown')}</button></div></div><div class="field"><label>Select size</label><div class="size-row">${(p.sizes||['One size']).map(s=>`<button class="size" onclick="pickSize(this,'${s}')">${s}</button>`).join('')}</div></div><button class="btn wide" onclick="add('${p.id}',currentSize)">Add to bag — ${rs(p.price)}</button><button class="btn alt wide" onclick="add('${p.id}',currentSize);go('checkout')">Buy it now ↗</button><div class="detail-note">Complimentary shipping on orders over ₹1,999<br>Easy returns within 7 days<br>Secure checkout · GST invoice available</div><div class="detail-note"><b>Product details</b><p>${esc(p.desc||'A considered everyday essential.')}</p><b>Delivery & returns</b><p>Delivery estimates are confirmed at checkout. Return eligibility is subject to store policy.</p></div></div></section>`}
function pickSize(el,s){currentSize=s;document.querySelectorAll('.size').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function add(id,size=''){let p=products.find(x=>x.id===id);if(!p)return;if((p.sizes||[]).length>1&&!size){toast('Please select a size first');return}let x=cart.find(x=>x.id===id&&x.size===size);x?x.qty++:cart.push({id:p.id,title:p.title,price:+p.price,qty:1,size});save();toast('Added to your bag');}
function totals(){let sub=cart.reduce((a,x)=>a+x.price*x.qty,0),threshold=+(localStorage.getItem('jd_free_ship')||JENDORA_CONFIG.freeShippingThreshold),ship=sub===0||sub>=threshold?0:+(localStorage.getItem('jd_ship')||JENDORA_CONFIG.shippingFee),gst=sub*(+(localStorage.getItem('jd_gst')||JENDORA_CONFIG.gstRate))/100;return{sub,ship,gst,total:sub+ship+gst}}
function summary(){let t=totals();return `<div class="panel summary"><h2>Order summary</h2><p>Subtotal <b>${rs(t.sub)}</b></p><p>Shipping <b>${t.ship?rs(t.ship):'Complimentary'}</b></p><p>Estimated GST (18%) <b>${rs(t.gst)}</b></p><p class="total"><b>Total</b><b>${rs(t.total)}</b></p><small class="muted">GST is an estimate; final tax invoice depends on applicable product tax rates.</small></div>`}
function cartPage(){if(!cart.length)return `<div class="empty"><div class="eyebrow">Your Jendora bag</div><h2>A little room for something lovely.</h2><p class="muted">Your bag is currently empty.</p><button class="btn" onclick="go('shop')">Continue shopping</button></div>`;return `<div class="page-title"><div class="crumb">Your selection</div><h1>Your bag</h1><p class="muted">${cart.reduce((a,x)=>a+x.qty,0)} item(s) selected</p></div><div class="cart-layout"><div class="panel"><h2>Selected pieces</h2>${cart.map(x=>`<div class="cartline"><div class="mini-photo">✧</div><div><b>${esc(x.title)}</b><p class="muted">${x.size||'One size'} · ${rs(x.price)}</p><div class="qty"><button onclick="changeQty('${x.id}','${x.size}',-1)">−</button>${x.qty}<button onclick="changeQty('${x.id}','${x.size}',1)">+</button><button class="textbtn" onclick="removeItem('${x.id}','${x.size}')">Remove</button></div></div><strong>${rs(x.price*x.qty)}</strong></div>`).join('')}</div><div>${summary()}<button class="btn wide" onclick="go('checkout')">Continue to checkout ↗</button><button class="btn alt wide" onclick="go('shop')">Continue shopping</button></div></div>`}
function changeQty(id,size,d){let x=cart.find(x=>x.id===id&&x.size===size);if(x)x.qty+=d;cart=cart.filter(x=>x.qty>0);save();render()}
function removeItem(id,size){cart=cart.filter(x=>!(x.id===id&&x.size===size));save();render()}
function checkout(){if(!cart.length){go('cart');return}return `<div class="page-title"><div class="crumb">Your bag / Checkout</div><h1>Checkout</h1><div class="stepbar"><span class="on">01 · Details</span><span class="on">02 · Delivery</span><span>03 · Payment</span></div></div><div class="checkout-layout"><div class="panel"><h2>Delivery information</h2><div class="two"><div class="field"><label>First name</label><input id="first" placeholder="First name" value="${esc(customer?.first||'')}"></div><div class="field"><label>Last name</label><input id="last" placeholder="Last name" value="${esc(customer?.last||'')}"></div></div><div class="field"><label>Email address</label><input id="email" type="email" placeholder="you@example.com" value="${esc(customer?.email||'')}"></div><div class="field"><label>Mobile number</label><input id="phone" placeholder="10-digit mobile number"></div><div class="field"><label>Address</label><textarea id="address" rows="3" placeholder="House / flat, street, area"></textarea></div><div class="two"><div class="field"><label>City</label><input id="city" placeholder="City"></div><div class="field"><label>PIN code</label><input id="pin" placeholder="PIN code"></div></div><h2>Payment method</h2><label><input type="radio" name="pay" value="COD" checked> Cash on delivery</label><br><label><input type="radio" name="pay" value="Online (demo)"> Online payment (demo only)</label><div class="notice muted">Payment gateway is not connected in this prototype. Do not enter card or UPI credentials here.</div><button class="btn wide" onclick="placeOrder()">Place demo order · ${rs(totals().total)}</button></div><div>${summary()}</div></div>`}
function placeOrder(){let required=['first','last','email','phone','address','city','pin'];for(let id of required){if(!$(id)||!$(id).value.trim()){toast('Please complete '+id);$(id)?.focus();return}}let t=totals(),method=document.querySelector('input[name=pay]:checked').value,paid=method==='Online (demo)',o={id:'JD'+Date.now().toString().slice(-8),date:new Date().toLocaleString(),items:[...cart],subtotal:t.sub,gst:t.gst,shipping:t.ship,total:t.total,status:'Order placed',payment:method,paymentStatus:paid?'PAID (DEMO ONLY)':'PAYMENT DUE ON DELIVERY',invoiceNo:paid?'INV-JD'+Date.now().toString().slice(-8):null,customer:{first:$('first').value,last:$('last').value,email:$('email').value,phone:$('phone').value,address:$('address').value,city:$('city').value,pin:$('pin').value}};orders.unshift(o);customer=o.customer;cart=[];save();go('confirmation',o.id)}
function confirmation(id){let o=orders.find(x=>x.id===id)||orders[0];return `<div class="empty"><div class="eyebrow">Thank you for choosing Jendora</div><h2>Your order is in good hands.</h2><p>Order <b>${o?.id||''}</b> has been placed in this demo store.</p><span class="status">${o?.status||'Order placed'}</span><p>${o?.paymentStatus==='PAID (DEMO ONLY)'?'Payment marked successful in demo — invoice generated automatically.':'Invoice will be generated after payment is confirmed.'}</p>${o?.invoiceNo?`<button class="btn alt" onclick="printInvoice('${o.id}')">View / Print invoice</button>`:''}<br><button class="btn" onclick="go('track',o.id)">Track your order</button> <button class="btn alt" onclick="go('shop')">Continue exploring</button></div>`}
function account(){return `<div class="page-title"><div class="crumb">Jendora / Account</div><h1>Your account</h1><p class="muted">A personal space for your orders and details.</p></div><div class="account-layout"><div class="panel"><h2>${customer?'Welcome back, '+esc(customer.first||''):'Sign in to Jendora'}</h2><p class="muted">Access your order history, delivery updates and saved details.</p><div class="field"><label>Email address</label><input id="loginEmail" type="email" placeholder="you@example.com" value="${esc(customer?.email||'')}"></div><button class="btn" onclick="loginDemo()">Continue with email (demo)</button><button class="btn alt" onclick="googleDemo()">Continue with Google (demo)</button><div class="notice">Authentication is simulated locally. Real Google sign-in and private customer accounts require Firebase/Supabase and secure server rules.</div></div><div class="panel"><h2>Account menu</h2><p><a href="#orders">My orders ↗</a></p><p><a href="#track">Track an order ↗</a></p><p><a href="#cart">My bag ↗</a></p><p><a href="#shop">Continue shopping ↗</a></p></div></div>`}
function loginDemo(){let e=$('loginEmail').value;if(!e){toast('Enter your email');return}customer={email:e,first:e.split('@')[0]};save();toast('Demo sign-in successful');render()}
function googleDemo(){customer={email:'google-demo@example.com',first:'Jendora customer'};save();toast('Google sign-in preview only');render()}
function orderList(){return `<div class="page-title"><div class="crumb">Account / Orders</div><h1>Your orders</h1><p class="muted">Every order, all in one place.</p></div>${orders.length?orders.map(o=>`<div class="order"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>Order ${o.id}</b><span class="status">${o.status}</span></div><p class="muted">${o.date} · ${o.items.length} item(s)</p><p><b>${rs(o.total)}</b></p><p class="muted">${o.items.map(i=>esc(i.title)+' × '+i.qty).join(' · ')}</p><button class="btn" onclick="go('track','${o.id}')">Track order</button></div>`).join(''):'<div class="empty"><h2>No orders yet</h2><p class="muted">Your future orders will appear here.</p><button class="btn" onclick="go(\'shop\')">Explore the collection</button></div>'}`}
function tracking(id){let o=orders.find(x=>x.id===id)||orders[0];return `<div class="page-title"><div class="crumb">Account / Order tracking</div><h1>Track your order</h1></div><div class="panel"><div class="field"><label>Order ID</label><input id="trackId" placeholder="e.g. JD12345678" value="${id||o?.id||''}"></div><button class="btn" onclick="renderTrack()">Find order</button><div id="trackResult">${o?trackCard(o):'<p class="muted">Enter an order ID to see its status.</p>'}</div></div>`}
function trackCard(o){let stages=['Order placed','Confirmed','Packed','Shipped','Out for delivery','Delivered'],n=Math.max(0,stages.indexOf(o.status));return `<h2>${o.id}</h2><span class="status">${o.status}</span><div class="trackline">${stages.map((s,i)=>`<div><div class="dot" style="opacity:${i<=n?1:.25}"></div>${s}</div>`).join('')}</div><p class="muted">Demo tracking timeline. Live carrier tracking needs a shipping provider integration.</p><p><b>Ship to:</b> ${esc(o.customer?.address||'Customer address not recorded')}</p>`}
function renderTrack(){let id=$('trackId').value.trim(),o=orders.find(x=>x.id===id);$('trackResult').innerHTML=o?trackCard(o):'<p class="muted">No matching order found.</p>'}
function admin(){return `<section class="admin" id="admin"><h2>Store administration</h2><p class="muted">Local prototype only. Production admin access must be verified server-side using Google OAuth and an allowlisted Gmail.</p><button class="btn" onclick="adminTab('products')">Products</button><button class="btn" onclick="adminTab('orders')">Orders</button><button class="btn" onclick="adminTab('settings')">Settings</button><button class="btn alt" onclick="document.getElementById('adminCsv').click()">Import CSV</button><input hidden type="file" id="adminCsv" accept=".csv" onchange="importProducts(this.files[0])"><div id="adminContent"></div></section>`}
function adminTab(t){let c=$('adminContent');if(t==='products')c.innerHTML=`<h3>Products · ${products.length}</h3><button class="btn" onclick="exportProducts()">Export CSV</button>`;if(t==='orders')c.innerHTML=orders.map(o=>`<p>${o.id} · ${rs(o.total)} · <select onchange="updateStatus('${o.id}',this.value)">${['Order placed','Confirmed','Packed','Shipped','Out for delivery','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></p>`).join('')||'No orders';if(t==='settings')c.innerHTML='<p>Demo mode / theme / tax configuration can be connected to a protected backend in the production build.</p>'}
function updateStatus(id,s){let o=orders.find(x=>x.id===id);if(o)o.status=s;save();toast('Order status updated')}
function importProducts(file){if(!file)return;let r=new FileReader();r.onload=()=>{let lines=r.result.split(/\r?\n/).filter(Boolean),h=lines.shift().split(',').map(x=>x.replace(/"/g,'').toLowerCase()),ix=k=>h.indexOf(k);products=lines.map((line,i)=>{let a=line.match(/("([^"]|"")*"|[^,]*)(,|$)/g)||[],v=a.map(x=>x.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"'));return{id:v[ix('id')]||'import'+i,title:v[ix('title')]||'Imported product',category:v[ix('category')]||'Other',price:+v[ix('price')]||0,icon:'✧',tag:'Imported'}});localStorage.setItem('jd_products',JSON.stringify(products));render();toast('Products imported')};r.readAsText(file)}
function exportProducts(){let csv='id,title,category,price\n'+products.map(p=>[p.id,p.title,p.category,p.price].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.href=u;a.download='jendora-products.csv';a.click();URL.revokeObjectURL(u)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let h=location.hash.slice(1)||'home',[page,arg]=h.split('?');arg=arg?decodeURIComponent(arg):'';let content=page==='home'?home():page==='shop'?shop():page==='product'?productPage(arg):page==='cart'?cartPage():page==='checkout'?checkout():page==='confirmation'?confirmation(arg):page==='account'?account():page==='orders'?orderList():page==='track'?tracking(arg):home();$('app').innerHTML=content+((page==='home')?admin():'');save();if(page==='home'&&sessionStorage.getItem('jd_admin')==='yes')$('admin').style.display='block'}


function card(p){return `<article class="card" onclick="go('product','${p.id}')"><div class="photo">${p.image?`<img src="${esc(p.image)}" style="width:100%;height:100%;object-fit:cover">`:(p.icon||'✧')}<span class="tag">${esc(p.tag||p.category||'Jendora')}</span><button class="wish" onclick="event.stopPropagation();toast('Saved to wishlist')">♡</button></div><div class="card-info"><small>${esc(p.brand||p.category||'Jendora')}</small><h3>${esc(p.title)}</h3><span class="rating">★★★★★ <b>${Number(p.rating||4.8).toFixed(1)}</b> <i>(${p.reviews||0})</i></span><br><span class="price">${rs(p.price)}</span><div class="card-actions"><span class="muted">Curated quality</span><button class="add-card" onclick="event.stopPropagation();add('${p.id}')">＋ Add to cart</button></div></div></article>`}
function renderReviews(p){let a=p.reviewList||[];return a.length?a.map(r=>`<article class="review-card"><div class="review-top"><b>${esc(r.name||'Customer')}</b><span class="rating">${'★'.repeat(+r.rating||5)}</span></div><p>${esc(r.text)}</p><div class="review-images">${(r.images||[]).map(src=>`<img src="${src}">`).join('')}</div><small class="muted">${esc(r.date||'Customer review')}</small></article>`).join(''):'<p class="muted">No written reviews yet. Be the first to review this product.</p>'}
async function submitReview(id){let p=products.find(x=>x.id===id),files=[...($('reviewImages').files||[])];if(!$('reviewText').value.trim())return toast('Please write a review');let images=await Promise.all(files.slice(0,3).map(f=>new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)})));p.reviewList=p.reviewList||[];p.reviewList.unshift({name:$('reviewName').value||'Jendora customer',rating:+$('reviewRating').value,text:$('reviewText').value,images,date:new Date().toLocaleDateString('en-IN')});p.reviews=p.reviewList.length;p.rating=(p.reviewList.reduce((a,r)=>a+r.rating,0)/p.reviewList.length).toFixed(1);save();$('reviewList').innerHTML=renderReviews(p);toast('Review added')}
function productPage(id){let p=products.find(x=>x.id===id)||products[0];currentProduct=p;currentSize='';let imgs=(p.images||[p.image,p.image,p.image]).filter(Boolean);return `<div class="crumb" style="padding-top:30px"><a href="#shop">Home / Shop</a> / ${esc(p.category||'Collection')}</div><section class="detail"><div class="gallery">${imgs.length?imgs.map(src=>`<div class="real-photo"><img src="${esc(src)}"></div>`).join(''):`<div>${p.icon||'✧'}</div><div>${p.icon||'✧'}</div><div>${p.icon||'✧'}</div>`}</div><div class="buybox"><div class="eyebrow">${esc(p.brand||'JENDORA EDIT')}</div><h1>${esc(p.title)}</h1><div class="rating">★★★★★ <b>${Number(p.rating||4.8).toFixed(1)}/5</b> <a href="#reviews">(${p.reviews||0} reviews)</a></div><div class="price">${rs(p.price)}</div><p>${esc(p.desc||'Thoughtfully selected for everyday living.')}</p><div class="detail-note"><b>Brand</b><p>${esc(p.brand||'Jendora')}</p><b>Product information</b><p>${esc(p.details||p.desc||'A considered everyday essential.')}</p><p><b>SKU:</b> ${esc(p.sku||'JD-'+p.id)} · <b>Material:</b> ${esc(p.material||'See product label')}</p></div><div class="field"><label>Select size</label><div class="size-row">${(p.sizes||['One size']).map(v=>`<button class="size" onclick="pickSize(this,'${v}')">${v}</button>`).join('')}</div></div><button class="btn wide" onclick="add('${p.id}',currentSize)">＋ Add to cart — ${rs(p.price)}</button><button class="btn alt wide" onclick="add('${p.id}',currentSize);go('checkout')">Buy it now ↗</button></div></section><section class="section" id="reviews"><div class="secthead"><h2>Ratings & reviews</h2><button class="btn" onclick="document.getElementById('reviewForm').scrollIntoView({behavior:'smooth'})">Write a review</button></div><div class="review-summary"><strong>${Number(p.rating||4.8).toFixed(1)} <span>★★★★★</span></strong> · ${(p.reviewList||[]).length} written reviews</div><div id="reviewList">${renderReviews(p)}</div><div class="panel" id="reviewForm"><h3>Share your experience</h3><div class="field"><label>Rating</label><select id="reviewRating"><option value="5">★★★★★ Excellent</option><option value="4">★★★★ Good</option><option value="3">★★★ Average</option><option value="2">★★ Below expectations</option><option value="1">★ Poor</option></select></div><div class="field"><label>Name</label><input id="reviewName" placeholder="Your name"></div><div class="field"><label>Review</label><textarea id="reviewText" rows="3"></textarea></div><div class="field"><label>Photos (up to 3)</label><input id="reviewImages" type="file" accept="image/*" multiple></div><button class="btn" onclick="submitReview('${p.id}')">Submit review</button></div></section>`}
function orderList(){return `<div class="page-title"><div class="crumb">Account / Orders</div><h1>Order status</h1><p class="muted">Check every order and its latest update.</p></div>${orders.length?orders.map(o=>`<div class="order"><div class="order-heading"><b>${esc(o.id)}</b><span class="status">${esc(o.status||'Order placed')}</span></div><p class="muted">${esc(o.date||'')} · ${(o.items||[]).length} item(s)</p><p><b>${rs(o.total)}</b></p><p class="muted">${(o.items||[]).map(i=>esc(i.title)+' × '+i.qty).join(' · ')}</p><button class="btn" onclick="go('track','${o.id}')">View order status →</button></div>`).join(''):'<div class="empty"><h2>No orders yet</h2><p class="muted">Your orders will appear here after checkout.</p><button class="btn" onclick="history.back()">Explore collection</button></div>'}`}
function tracking(id){let o=orders.find(x=>x.id===id)||null;return `<div class="page-title"><div class="crumb">Account / Order status</div><h1>Track your order</h1></div><div class="panel"><div class="field"><label>Order ID</label><input id="trackId" placeholder="JD12345678" value="${esc(id||o?.id||'')}"></div><button class="btn" onclick="renderTrack()">Find order</button><div id="trackResult">${o?trackCard(o):'<p class="muted">Enter order ID to view status.</p>'}</div></div>`}
function adminLogin(){let m=prompt('Admin Gmail login');if((m||'').trim().toLowerCase()==='admin@gmail.com'){sessionStorage.setItem('jd_admin','yes');go('admin');toast('Admin dashboard unlocked')}else toast('Access denied — admin Gmail only')}
function adminLogout(){sessionStorage.removeItem('jd_admin');go('home')}
function admin(){if(sessionStorage.getItem('jd_admin')!=='yes')return '';return `<section class="admin"><h2>JENDORA Admin Dashboard</h2><p class="muted">Signed in as admin@gmail.com</p><div class="admin-stats"><div>PRODUCTS<b>${products.length}</b></div><div>ORDERS<b>${orders.length}</b></div><div>REVENUE<b>${rs(orders.reduce((a,o)=>a+(+o.total||0),0))}</b></div><div>REVIEWS<b>${products.reduce((a,p)=>a+(p.reviewList||[]).length,0)}</b></div></div><div class="admin-nav"><button onclick="adminTab('products')">Products</button><button onclick="adminTab('orders')">Orders</button><button onclick="adminTab('content')">Banners & categories</button><button onclick="adminTab('settings')">Settings</button><button onclick="document.getElementById('adminCsv').click()">Import CSV</button><button onclick="adminLogout()">Sign out</button><input hidden id="adminCsv" type="file" accept=".csv" onchange="importProducts(this.files[0])"></div><div id="adminContent"></div></section>`}
function adminTab(t){let c=$('adminContent');if(!c)return;if(t==='products')c.innerHTML=`<h3>Products · ${products.length}</h3><button class="btn" onclick="newProduct()">＋ Add product</button><button class="btn alt" onclick="exportProducts()">Export CSV</button>${products.map(p=>`<div class="admin-row"><div><b>${esc(p.title)}</b><small>${esc(p.brand||'Jendora')} · ${rs(p.price)}</small></div><button class="btn alt" onclick="editProduct('${p.id}')">Edit</button><button class="btn" onclick="deleteProduct('${p.id}')">Delete</button></div>`).join('')}`;if(t==='orders')c.innerHTML=orders.map(o=>`<div class="admin-row"><b>${esc(o.id)} · ${rs(o.total)}</b><select onchange="updateStatus('${o.id}',this.value)">${['Order placed','Confirmed','Packed','Shipped','Out for delivery','Delivered','Cancelled'].map(v=>`<option ${v===o.status?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')||'No orders yet';if(t==='content')c.innerHTML=`<h3>Homepage content</h3><label>Announcement bar</label><input id="announceText" value="${esc(localStorage.getItem('jd_announcement')||'Complimentary shipping over ₹1,999')}"><label>Hero heading</label><input id="heroText" value="${esc(localStorage.getItem('jd_hero')||'Find clothes that match your style')}"><button class="btn" onclick="localStorage.setItem('jd_announcement',$('announceText').value);localStorage.setItem('jd_hero',$('heroText').value);toast('Content saved')">Save content</button><p>Categories: ${[...new Set(products.map(p=>p.category))].join(' · ')}</p>`;if(t==='settings')c.innerHTML=`<h3>Store settings</h3><label>GST rate %</label><input id="gstRate" type="number" value="${localStorage.getItem('jd_gst')||18}"><label>Shipping ₹</label><input id="shipFee" type="number" value="${localStorage.getItem('jd_ship')||99}"><label>Free shipping threshold ₹</label><input id="freeShip" type="number" value="${localStorage.getItem('jd_free_ship')||1999}"><label>Discount %</label><input id="discount" type="number" value="${localStorage.getItem('jd_discount')||0}"><button class="btn" onclick="localStorage.setItem('jd_gst',$('gstRate').value);localStorage.setItem('jd_ship',$('shipFee').value);localStorage.setItem('jd_free_ship',$('freeShip').value);localStorage.setItem('jd_discount',$('discount').value);toast('Settings saved')">Save settings</button>`}
function newProduct(){let t=prompt('Product name');if(!t)return;products.unshift({id:'jd'+Date.now(),title:t,price:+prompt('Price ₹','999')||0,brand:prompt('Brand','Jendora')||'Jendora',category:prompt('Category','Other')||'Other',image:prompt('Image URL','')||'',desc:'Product description',sizes:['S','M','L']});save();adminTab('products')}
function editProduct(id){let p=products.find(x=>x.id===id);if(!p)return;p.title=prompt('Title',p.title)||p.title;p.brand=prompt('Brand',p.brand||'Jendora')||p.brand;p.price=+(prompt('Price ₹',p.price)||p.price);p.desc=prompt('Description',p.desc||'')||p.desc;p.details=prompt('Product information',p.details||'')||p.details;p.image=prompt('Image URL',p.image||'')||p.image;save();adminTab('products')}
function deleteProduct(id){if(confirm('Delete product?')){products=products.filter(p=>p.id!==id);save();adminTab('products')}}
function updateStatus(id,v){let o=orders.find(x=>x.id===id);if(o)o.status=v;save();toast('Order status updated')}
function render(){let h=location.hash.slice(1)||'home',[page,arg]=h.split('?');arg=arg?decodeURIComponent(arg):'';let content=page==='admin'?(sessionStorage.getItem('jd_admin')==='yes'?admin():'<div class="empty"><h2>Admin sign-in required</h2><button class="btn" onclick="adminLogin()">Admin login</button></div>'):page==='home'?home():page==='shop'?shop():page==='product'?productPage(arg):page==='cart'?cartPage():page==='checkout'?checkout():page==='confirmation'?confirmation(arg):page==='account'?account():(page==='orders'||page==='order-status')?orderList():(page==='track'||page==='order')?tracking(arg):home();$('app').innerHTML=content;save();}

function parseJendoraCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v!==''))rows.push(row);return rows}
function productKey(p){let sku=(p.sku||'').trim().toLowerCase();if(sku)return 'sku:'+sku;return 'name:'+(String(p.brand||'').trim().toLowerCase()+'|'+String(p.title||'').trim().toLowerCase()).replace(/\s+/g,' ')}
function importProducts(file){if(!file)return;let r=new FileReader();r.onload=()=>{let rows=parseJendoraCSV(r.result),heads=(rows.shift()||[]).map(v=>v.trim().toLowerCase()),ix=k=>heads.indexOf(k),imported=rows.filter(row=>row[ix('title')]||row[ix('product title')]).map((v,i)=>({id:v[ix('id')]||'import-'+Date.now()+'-'+i,title:v[ix('title')]||v[ix('product title')],brand:v[ix('brand')]||v[ix('vendor')]||'Jendora',category:v[ix('category')]||v[ix('type')]||'Other',price:+(v[ix('price')]||v[ix('variant price')]||0),old:+(v[ix('original_price')]||0),image:v[ix('image')]||v[ix('image src')]||'',desc:v[ix('description')]||v[ix('body (html)')]||'',details:v[ix('details')]||'',sku:v[ix('sku')]||v[ix('variant sku')]||'',tag:'Imported'}));let seen=new Set(products.map(productKey)),added=0,skipped=0;for(let p of imported){let k=productKey(p);if(seen.has(k)){skipped++;continue}seen.add(k);products.push(p);added++}save();render();toast(`${added} added · ${skipped} duplicates skipped`)};r.readAsText(file)}
function printInvoice(id){let o=orders.find(x=>x.id===id);if(!o||!o.invoiceNo||o.paymentStatus!=='PAID (DEMO ONLY)'&&o.paymentStatus!=='PAID')return toast('Invoice available after confirmed payment');let rows=o.items.map(x=>`<tr><td>${esc(x.title)} ${x.size?'('+esc(x.size)+')':''}</td><td>${x.qty}</td><td>₹${(x.price*x.qty).toLocaleString('en-IN')}</td></tr>`).join('');let w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print invoice');w.document.write(`<html><head><title>${o.invoiceNo}</title><style>body{font:14px Arial;padding:35px;color:#222}h1{letter-spacing:4px}table{width:100%;border-collapse:collapse;margin-top:25px}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}.total{text-align:right;margin-top:25px}</style></head><body><h1>JENDORA</h1><h2>Tax / Order Invoice</h2><p>Invoice: ${o.invoiceNo}<br>Order: ${o.id}<br>Date: ${o.date}<br>Payment: ${o.paymentStatus}</p><h3>Bill to</h3><p>${esc(o.customer.first)} ${esc(o.customer.last)}<br>${esc(o.customer.address)}, ${esc(o.customer.city)} - ${esc(o.customer.pin)}<br>${esc(o.customer.email)} · ${esc(o.customer.phone)}</p><table><tr><th>Product</th><th>Qty</th><th>Amount</th></tr>${rows}</table><div class="total">Subtotal: ₹${o.subtotal.toFixed(2)}<br>GST: ₹${o.gst.toFixed(2)}<br>Shipping: ₹${o.shipping.toFixed(2)}<h2>Total: ₹${o.total.toFixed(2)}</h2></div><p>Thank you for shopping with Jendora.</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}

document.addEventListener('click',e=>{let a=e.target.closest('a[href^="#"]');if(a)setTimeout(render,0)});window.addEventListener('hashchange',render);
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='a')adminLogin()});render();
</script></body></html>
