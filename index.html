<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JENDORA — Modern fashion</title><meta name="description" content="Discover considered fashion at JENDORA"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><style>
:root{--ink:#181916;--muted:#777970;--line:#e9e9e4;--paper:#fff;--wash:#f5f5f0;--olive:#777c62}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff;font:14px/1.55 Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.wrap{max-width:1320px;margin:auto;padding:0 32px}.announce{text-align:center;background:#282a24;color:#f5f4ed;padding:9px;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.head{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}.logo{font:30px Georgia,serif;letter-spacing:.18em}.logo small{display:block;text-align:center;font:9px Arial;letter-spacing:.35em;color:var(--muted)}nav{display:flex;gap:28px;font-size:12px;color:#55584e}.actions{display:flex;gap:8px}.pill,.btn{border:1px solid var(--line);background:white;border-radius:30px;padding:10px 17px}.btn.dark{background:#292b25;color:#fff;border-color:#292b25}.hero{margin:30px 0 48px;min-height:370px;background:#f0f0e9;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.hero-copy{padding:55px 7vw;align-self:center}.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:10px;color:var(--olive)}h1,h2,h3{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(42px,5vw,68px);line-height:1.04;margin:14px 0}.hero p{max-width:400px;color:#62645b}.hero-art{background:linear-gradient(140deg,#c5c9b9,#e3dfd2);display:grid;place-items:center;color:#fff;font:clamp(120px,23vw,260px) Georgia}.section{margin:48px 0}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}.section h2{font-size:34px;margin:5px 0}.cats{display:flex;gap:9px;overflow:auto}.cat{padding:10px 19px;border:1px solid var(--line);border-radius:30px;background:white;white-space:nowrap}.cat.active{background:#292b25;color:white}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{border:1px solid #eee;border-radius:15px;padding:10px;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 15px 35px #0000000c}.photo{height:270px;border-radius:11px;background:var(--wash);overflow:hidden;display:grid;place-items:center}.photo img{width:100%;height:100%;object-fit:contain}.photo .placeholder{font:64px Georgia;color:#c5c7bd}.info{padding:12px 4px 6px}.info small{color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.info h3{font-size:18px;margin:5px 0}.price{font-weight:bold}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.banner{min-height:150px;padding:30px;background:#e8eadf;display:flex;justify-content:space-between;align-items:center}.banner h2{font-size:32px;margin:4px 0}.footer{margin-top:70px;padding:35px 0;border-top:1px solid var(--line);color:var(--muted)}.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:9}.modal{background:#fff;border-radius:18px;padding:25px;max-width:560px;width:100%;max-height:90vh;overflow:auto}.field{display:grid;gap:6px;margin:12px 0}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:9px;padding:12px;width:100%}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#252720;color:white;padding:12px 20px;border-radius:30px;z-index:20}.empty,.loading{padding:45px 15px;text-align:center;color:var(--muted);background:#fafaf8;border-radius:14px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:35px}.detail img{width:100%;max-height:560px;object-fit:contain;background:var(--wash);border-radius:15px}.qty{display:flex;gap:12px;align-items:center;margin:16px 0}.qty button{border:1px solid var(--line);background:#fff;border-radius:50%;width:32px;height:32px}@media(max-width:850px){.wrap{padding:0 17px}nav{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:220px}.hero{grid-template-columns:1fr;min-height:0}.hero-copy{padding:35px}.hero-art{min-height:180px}.detail{grid-template-columns:1fr}.head{height:70px}.logo{font-size:24px}}
</style></head><body><div class="announce" id="announce">JENDORA · CONSIDERED STYLE, EVERY DAY</div><header class="wrap head"><a class="logo" href="#home">JENDORA<small>STYLE, REDEFINED</small></a><nav><a href="#home">HOME</a><a href="#shop">SHOP</a><a href="#shop?category=Women">WOMEN</a><a href="#shop?category=Men">MEN</a></nav><div class="actions"><button class="pill" onclick="openCart()">Bag <span id="bagCount">0</span></button><button class="pill" onclick="account()">Account</button></div></header><main class="wrap" id="app"><div class="loading">Connecting to JENDORA store…</div></main><footer class="wrap footer"><div class="row"><span>© <span id="year"></span> JENDORA</span><span>Thoughtful style. Effortless living.</span><a href="admin.html">Admin</a></div></footer><div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><script>
const $=id=>document.getElementById(id),db=window.JENDORA_DB;let products=[],categories=[],banners=[],settings={},cart=[],currentCategory='All',currentProduct=null;const ru=n=>'₹'+(Number(n||0)).toLocaleString('en-IN',{maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){let n=document.createElement('div');n.className='toast';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),2600)}function fail(e){console.error(e);toast(e.message||'Something went wrong')}async function boot(){ $('year').textContent=new Date().getFullYear();if(!db.ready()){ $('app').innerHTML='<div class="empty"><h2>Connect your Supabase project</h2><p>Add your project URL and publishable/anon key in config.js, then reload.</p></div>';return}try{[products,categories,banners,settings]=await Promise.all([db.products(),db.categories(),db.banners(),db.settings()]);if(settings.announcement)$('announce').textContent=String(settings.announcement).replace(/^"|"$/g,'');render()}catch(e){$('app').innerHTML='<div class="empty"><h2>Store connection failed</h2><p>'+esc(e.message)+'</p><button class="btn" onclick="boot()">Retry</button></div>'}}function img(p){let src=p.image_url||(p.images||[])[0];return src?`<img src="${esc(src)}" alt="${esc(p.title)}" loading="lazy">`:'<span class="placeholder">J</span>'}function card(p){return `<article class="card" onclick="showProduct('${p.id}')"><div class="photo">${img(p)}</div><div class="info"><small>${esc(p.brand||p.category||'JENDORA')}</small><h3>${esc(p.title)}</h3><div class="row"><span class="price">${ru(p.price_paise/100)}</span><span class="muted">${p.stock>0?'In stock':'Sold out'}</span></div></div></article>`}function render(){let hero=banners[0];$('app').innerHTML=`${hero?`<section class="hero"><div class="hero-copy"><div class="eyebrow">${esc(hero.subtitle||'THE NEW COLLECTION')}</div><h1>${esc(hero.title)}</h1><p>Discover pieces made to move with you.</p><a class="btn dark" href="${esc(hero.link_url||'#shop')}">Explore collection ↗</a></div><div class="hero-art">${hero.image_url?`<img src="${esc(hero.image_url)}" style="width:100%;height:100%;object-fit:cover">`:'J'}</div></section>`:`<section class="hero"><div class="hero-copy"><div class="eyebrow">THE JENDORA EDIT</div><h1>Find your<br>own rhythm.</h1><p>Discover considered fashion for the moments that make you.</p><a class="btn dark" href="#shop">Shop collection ↗</a></div><div class="hero-art">J</div></section>`}<section class="section"><div class="section-head"><div><div class="eyebrow">CURATED FOR YOU</div><h2>Explore categories</h2></div></div><div class="cats"><button class="cat ${currentCategory==='All'?'active':''}" onclick="filterCat('All')">All</button>${categories.map(c=>`<button class="cat ${currentCategory===c.name?'active':''}" onclick="filterCat('${esc(c.name)}')">${esc(c.name)}</button>`).join('')}</div></section><section class="section" id="shop"><div class="section-head"><div><div class="eyebrow">THE COLLECTION</div><h2>${currentCategory==='All'?'Latest arrivals':esc(currentCategory)}</h2></div><span class="muted">${products.filter(p=>currentCategory==='All'||p.category===currentCategory).length} pieces</span></div><div class="grid">${products.filter(p=>currentCategory==='All'||p.category===currentCategory).map(card).join('')}</div>${!products.length?'<div class="empty"><h2>Our collection is taking shape</h2><p>New pieces will appear here as soon as they are added.</p></div>':''}</section><section class="banner"><div><div class="eyebrow">A LITTLE SOMETHING EXTRA</div><h2>Style that feels like you.</h2><p class="muted">Explore the JENDORA collection.</p></div><a class="btn dark" href="#shop">Shop now ↗</a></section>`}function filterCat(c){currentCategory=c;render();$('shop').scrollIntoView({behavior:'smooth'})}function showProduct(id){let p=products.find(x=>x.id===id);if(!p)return;currentProduct=p;$('app').innerHTML=`<p class="muted"><a href="#home">Home</a> / ${esc(p.category||'Collection')}</p><section class="detail"><div>${img(p).replace('<img ','<img style="width:100%;max-height:580px;object-fit:contain;background:#f5f5f0;border-radius:15px" ')}</div><div><div class="eyebrow">${esc(p.brand||'JENDORA')}</div><h1>${esc(p.title)}</h1><h2>${ru(p.price_paise/100)}</h2><p class="muted">${esc(p.description||'A considered addition to your everyday wardrobe.')}</p><p>${p.stock>0?`${p.stock} available`:'Currently unavailable'}</p>${(p.sizes||[]).length?`<div class="field"><label>Choose size</label><select id="size">${p.sizes.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>`:''}<div class="qty"><button onclick="changeQty(-1)">−</button><b id="qty">1</b><button onclick="changeQty(1)">+</button></div><button class="btn dark" ${p.stock<=0?'disabled':''} onclick="addCart()">Add to bag</button> <button class="btn" onclick="render()">Back to collection</button></div></section>`;window.detailQty=1;window.scrollTo(0,0)}function changeQty(n){window.detailQty=Math.max(1,Math.min(currentProduct.stock,window.detailQty+n));$('qty').textContent=window.detailQty}function addCart(){let size=$('size')?.value||null;let k=currentProduct.id+'|'+(size||'');let x=cart.find(i=>i.key===k);if(x)x.quantity+=window.detailQty;else cart.push({key:k,product_id:currentProduct.id,title:currentProduct.title,price_paise:currentProduct.price_paise,size,quantity:window.detailQty});$('bagCount').textContent=cart.reduce((a,x)=>a+x.quantity,0);toast('Added to bag');renderCartModal()}function openCart(){renderCartModal();$('overlay').style.display='flex'}function renderCartModal(){ $('bagCount').textContent=cart.reduce((a,x)=>a+x.quantity,0);$('modal').innerHTML=`<div class="row"><h2>Your bag</h2><button class="pill" onclick="closeModal()">✕</button></div>${cart.length?cart.map(x=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${esc(x.title)}</b><div class="muted">${x.size?'Size '+esc(x.size)+' · ':''}Qty ${x.quantity}</div></div><b>${ru(x.price_paise*x.quantity/100)}</b></div>`).join('')+`<h3 class="row"><span>Subtotal</span><span>${ru(cart.reduce((a,x)=>a+x.price_paise*x.quantity,0)/100)}</span></h3><button class="btn dark" onclick="checkout()">Continue to checkout</button>`:'<div class="empty">Your bag is empty.</div>'}` }function closeModal(){$('overlay').style.display='none'}function checkout(){if(!cart.length)return;$('modal').innerHTML=`<div class="row"><h2>Checkout</h2><button class="pill" onclick="closeModal()">✕</button></div><p class="muted">Order will be created as pending. Online payment is not enabled yet.</p><form onsubmit="placeOrder(event)"><div class="field"><label>Full name</label><input name="name" required minlength="2"></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Address</label><textarea name="address" required></textarea></div><div class="field"><label>City</label><input name="city" required></div><div class="field"><label>PIN code</label><input name="pin" required></div><button class="btn dark" type="submit">Place order · ${ru(cart.reduce((a,x)=>a+x.price_paise*x.quantity,0)/100)} + applicable charges</button></form>`}async function placeOrder(e){e.preventDefault();let f=new FormData(e.target);try{let data=await db.placeOrder({p_customer_name:f.get('name'),p_customer_email:f.get('email'),p_customer_phone:f.get('phone'),p_shipping_address:{address:f.get('address'),city:f.get('city'),pin:f.get('pin'),country:'India'},p_items:cart.map(x=>({product_id:x.product_id,quantity:x.quantity,size:x.size})),p_coupon_code:null});cart=[];$('bagCount').textContent='0';$('modal').innerHTML=`<div class="empty"><h2>Order received</h2><p>Your order number is <b>${esc(data.order_number)}</b>.</p><p>Payment status: PENDING. We have not charged you.</p><button class="btn dark" onclick="closeModal();boot()">Continue shopping</button></div>`;products=await db.products()}catch(err){fail(err)}}async function account(){try{let u=await db.user();if(!u){$('modal').innerHTML=`<h2>Your account</h2><p class="muted">Sign in securely with Google to view your order history.</p><button class="btn dark" onclick="db.googleLogin().catch(fail)">Continue with Google</button><button class="pill" onclick="closeModal()">Close</button>`;$('overlay').style.display='flex';return}let orders=await db.myOrders();$('modal').innerHTML=`<div class="row"><h2>Your orders</h2><button class="pill" onclick="db.signOut().then(()=>{closeModal();toast('Signed out')}).catch(fail)">Sign out</button></div><p class="muted">${esc(u.email)}</p>${orders.map(o=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(o.order_number)}</b><div>${esc(o.status)} · ${esc(o.payment_status)}</div><strong>${ru(o.total_paise/100)}</strong></div>`).join('')||'<p class="empty">No orders yet.</p>'}`;$('overlay').style.display='flex'}catch(e){fail(e)}}boot();
</script></body></html>
