<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHOP.CO</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#fff;--fg:#000;--mut:#666;--card:#f0eeed;--line:#e5e5e5;--red:#ff3333;--g:#01ab31}
@media(prefers-color-scheme:dark){:root{--bg:#0b0b0b;--fg:#fff;--mut:#aaa;--card:#1b1b1b;--line:#2a2a2a}}
*{box-sizing:border-box;margin:0}body{font-family:Inter,sans-serif;background:var(--bg);color:var(--fg)}
h1,h2,h3,.logo{font-family:'Archivo Black',sans-serif;text-transform:uppercase}
a{color:inherit;text-decoration:none;cursor:pointer}button,input,select,textarea{font:inherit}
.promo{background:#000;color:#fff;text-align:center;font-size:13px;padding:9px}
nav{display:flex;align-items:center;gap:20px;padding:16px 5vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:9}
.logo{font-size:26px}nav .links{display:flex;gap:18px;flex:1;font-size:15px}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:99px;padding:13px 28px;cursor:pointer;font-weight:500}
.btn.o{background:none;color:var(--fg);border:1px solid var(--line)}.btn.sm{padding:8px 16px;font-size:13px}
.wrap{padding:0 5vw;max-width:1300px;margin:auto}section{margin:50px 0}
.hero{background:var(--card);display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;padding:6vw 5vw}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1}.hero p{color:var(--mut);margin:18px 0 26px;max-width:480px}
.hero img{width:100%;border-radius:20px;height:420px;object-fit:cover}
.stats{display:flex;gap:30px;margin-top:30px}.stats b{font-size:30px;display:block}
.brands{background:#000;color:#fff;display:flex;justify-content:space-around;flex-wrap:wrap;gap:20px;padding:28px;font-family:'Archivo Black';font-size:24px}
.sec-t{text-align:center;font-size:clamp(28px,5vw,46px);margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;background:var(--card)}.card h4{margin:10px 0 4px}
.price b{font-size:20px}.price s{color:var(--mut);margin:0 6px}.off{background:#ff33331a;color:var(--red);border-radius:99px;padding:3px 9px;font-size:12px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;background:var(--card);padding:30px;border-radius:30px}
.cat{height:200px;border-radius:20px;background:var(--bg) center/cover;padding:20px;font:700 22px Inter;color:#fff;display:flex;align-items:flex-start;text-shadow:0 1px 8px #0008}
.sub{background:#000;color:#fff;border-radius:24px;padding:40px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sub h2{font-size:34px;max-width:420px}.sub form{display:flex;flex-direction:column;gap:10px;min-width:280px}
input,select,textarea{padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);width:100%}
.sub input{border-radius:99px}
footer{background:var(--card);padding:40px 5vw;margin-top:60px;color:var(--mut);font-size:14px}
.row{display:flex;gap:14px;align-items:center}.box{border:1px solid var(--line);border-radius:20px;padding:20px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}@media(max-width:800px){.two,.hero{grid-template-columns:1fr}nav .links{display:none}}
.steps{display:flex;justify-content:space-between;margin:14px 0}.st{flex:1;text-align:center;font-size:11px;color:var(--mut)}.st i{display:block;width:16px;height:16px;border-radius:50%;background:var(--line);margin:0 auto 4px}.st.on{color:var(--fg)}.st.on i{background:var(--g)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.tag{padding:3px 10px;border-radius:99px;background:var(--card);font-size:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 22px;border-radius:99px;display:none;z-index:99}
.sz{display:flex;gap:8px;margin:10px 0}.sz button{padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer}.sz .on{background:var(--fg);color:var(--bg)}
</style></head><body>
<div class="promo" id="promo">Sign up and get 20% off your first order — code WELCOME20 · Free shipping above ₹999</div>
<nav><a class="logo" href="#/">SHOP.CO</a><div class="links"><a href="#/shop">Shop</a><a href="#/shop/Casual">Casual</a><a href="#/shop/Formal">Formal</a><a href="#/orders">Orders</a><a id="adminLink" href="#/admin" hidden>Admin</a></div>
<a href="#/cart">🛒 <span id="cc">0</span></a><a id="auth" onclick="authClick()">Login</a></nav>
<main id="app"></main><div id="toast"></div>
<footer><div class="logo" style="color:var(--fg)">SHOP.CO</div><p style="margin:10px 0">We have clothes that suit your style. © 2026 · Returns within <span id="rd"></span> days.</p></footer>
<script>
const C=CONFIG,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),inr=n=>'₹'+Number(n).toLocaleString('en-IN');
$('#rd').textContent=C.RETURN_DAYS;
const LIVE=C.SUPABASE_URL&&!C.SUPABASE_URL.includes('YOUR_'),sb=LIVE?supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY):null;
const IMG=(q,i)=>`https://images.unsplash.com/${q}?w=600&q=70`;
// Shopify is the sole catalog source. No demo/localStorage product fallback.
async function fetchShopifyProducts(){
 const domain=String(C.SHOPIFY_DOMAIN||'').trim().replace(/^https?:\/\//,'').replace(/\/$/,'');
 const token=String(C.SHOPIFY_STOREFRONT_TOKEN||'').trim();
 if(!domain||!token) throw new Error('Shopify domain ya Storefront API token config.js mein missing hai.');
 const query=`query StorefrontProducts($cursor:String){products(first:100,after:$cursor,sortKey:UPDATED_AT,reverse:true){pageInfo{hasNextPage endCursor}edges{node{id handle title description productType featuredImage{url altText}images(first:1){edges{node{url altText}}}priceRange{minVariantPrice{amount currencyCode}}compareAtPriceRange{maxVariantPrice{amount currencyCode}}variants(first:1){edges{node{id title availableForSale price{amount currencyCode}compareAtPrice{amount currencyCode}}}}}}}}`;
 let cursor=null,all=[];
 for(let page=0;page<3;page++){
  const response=await fetch(`https://${domain}/api/2026-10/graphql.json`,{method:'POST',headers:{'Content-Type':'application/json','X-Shopify-Storefront-Access-Token':token},body:JSON.stringify({query,variables:{cursor}})});
  const body=await response.json();
  if(!response.ok||body.errors?.length) throw new Error(body.errors?.map(x=>x.message).join('; ')||`Shopify API error (${response.status})`);
  const connection=body.data?.products;if(!connection)throw new Error('Shopify se product data nahi mila. Storefront API access check karo.');
  all.push(...connection.edges.map(({node:n})=>{const v=n.variants?.edges?.[0]?.node||{};const price=Number(v.price?.amount??n.priceRange?.minVariantPrice?.amount??0);const compare=Number(v.compareAtPrice?.amount??n.compareAtPriceRange?.maxVariantPrice?.amount??price);const image=n.featuredImage?.url||n.images?.edges?.[0]?.node?.url||'';return{id:n.id,handle:n.handle,title:n.title,description:n.description,price,mrp:compare||price,image,category:n.productType||'Other',stock:v.availableForSale?1:0,available:v.availableForSale!==false,shopify:true}}));
  if(!connection.pageInfo.hasNextPage)break;cursor=connection.pageInfo.endCursor;
 }
 return all;
}
let P=[],cart=JSON.parse(localStorage.cart||'[]'),user=null;
const save=()=>{localStorage.cart=JSON.stringify(cart);$('#cc').textContent=cart.reduce((a,c)=>a+c.qty,0)};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)};
const isAdmin=()=>user&&C.ADMIN_EMAILS.includes(user.email);
// ---------- DATA LAYER (Supabase live, localStorage demo) ----------
const L=(k)=>JSON.parse(localStorage['db_'+k]||'[]'),W=(k,v)=>localStorage['db_'+k]=JSON.stringify(v);
const db={
 async products(){return await fetchShopifyProducts()},
 async orders(all){if(!sb)return L('orders').filter(o=>all||o.email===user?.email);let q=sb.from('orders').select('*').order('created_at',{ascending:false});const{data}=await q;return data||[]},
 async addOrder(o){o.created_at=new Date().toISOString();if(!sb){o.id='ORD'+Date.now();W('orders',[o,...L('orders')]);return o}const{data,error}=await sb.from('orders').insert(o).select().single();if(error)throw error;return data},
 async setOrder(id,status){if(!sb)return W('orders',L('orders').map(o=>o.id==id?{...o,status}:o));await sb.from('orders').update({status}).eq('id',id)},
 async returns(){if(!sb)return L('returns');const{data}=await sb.from('returns').select('*').order('created_at',{ascending:false});return data||[]},
 async addReturn(r){r.created_at=new Date().toISOString();if(!sb)return W('returns',[{...r,id:'RET'+Date.now()},...L('returns')]);await sb.from('returns').insert(r)},
 async setReturn(id,status){if(!sb)return W('returns',L('returns').map(o=>o.id==id?{...o,status}:o));await sb.from('returns').update({status}).eq('id',id)},
 async subs(){if(!sb)return L('subs');const{data}=await sb.from('subscribers').select('*');return data||[]},
 async addSub(email){if(!sb)return W('subs',[...L('subs'),{email}]);await sb.from('subscribers').upsert({email})},
 async addProduct(p){throw new Error('Products Shopify se sync hote hain. Naya product Shopify Admin mein add karo.')},
 async profile(){if(!sb)return JSON.parse(localStorage.profile||'{}');const{data}=await sb.from('profiles').select('*').maybeSingle();return data||{}},
 async saveProfile(p){if(!sb)return localStorage.profile=JSON.stringify(p);await sb.from('profiles').upsert({...p,id:user.id})}
};
// ---------- AUTH ----------
async function authClick(){if(user){if(sb)await sb.auth.signOut();user=null;localStorage.removeItem('demoUser');return setUser()}
 if(sb)return sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}});
 toast('Login ke liye Supabase URL aur anon key config.js mein set karo.')}
function setUser(){$('#auth').textContent=user?`Logout (${esc(user.name?.split(' ')[0]||'')})`:'Login';$('#adminLink').hidden=!isAdmin();route()}
async function initAuth(){if(sb){const{data}=await sb.auth.getSession();const u=data.session?.user;if(u)user={id:u.id,email:u.email,name:u.user_metadata?.full_name||u.email};sb.auth.onAuthStateChange((_,s)=>{const u=s?.user;user=u?{id:u.id,email:u.email,name:u.user_metadata?.full_name||u.email}:null;setUser()})}}
// ---------- PIN + DELIVERY DATE ----------
async function pinInfo(pin){try{const r=await(await fetch('https://api.postalpincode.in/pincode/'+pin)).json();const o=r[0]?.PostOffice?.[0];if(!o)return null;const metro=['Mumbai','Pune','Delhi','Bengaluru','Hyderabad','Chennai','Kolkata'].some(m=>o.District.includes(m)||o.Block?.includes(m));const d=new Date();d.setDate(d.getDate()+(metro?3:6));return{city:o.District,state:o.State,eta:d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}}catch{return null}}
function detectPin(inputId,outId){if(!navigator.geolocation)return toast('Location support nahi hai');navigator.geolocation.getCurrentPosition(async p=>{try{const r=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${p.coords.latitude}&lon=${p.coords.longitude}`)).json();const pin=(r.address?.postcode||'').replace(/\s/g,'');$('#'+inputId).value=pin;checkPin(inputId,outId)}catch{toast('Pin detect nahi hua')}},()=>toast('Location permission do'))}
async function checkPin(inputId,outId){const v=$('#'+inputId).value.trim(),o=$('#'+outId);if(!/^\d{6}$/.test(v)){o.textContent='';return}o.textContent='Checking…';const i=await pinInfo(v);o.innerHTML=i?`📍 ${esc(i.city)}, ${esc(i.state)} — Delivery by <b>${i.eta}</b>`:'Invalid pincode';if(i)localStorage.pin=v}
const pinUI=id=>`<div class="row"><input id="${id}" maxlength="6" placeholder="Pincode" value="${localStorage.pin||''}" oninput="checkPin('${id}','${id}o')"><button class="btn o sm" type="button" onclick="detectPin('${id}','${id}o')">Detect</button></div><p id="${id}o" style="font-size:13px;margin:6px 0"></p>`;
// ---------- VIEWS ----------
const card=p=>`<a class="card" href="#/p/${p.id}"><img src="${esc(p.image)}" loading="lazy" alt=""><h4>${esc(p.title)}</h4><div class="price"><b>${inr(p.price)}</b>${p.mrp>p.price?`<s>${inr(p.mrp)}</s><span class="off">-${Math.round(100-p.price/p.mrp*100)}%</span>`:''}</div></a>`;
const V={
 home:()=>`<div class="hero"><div><h1>Find clothes that matches your style</h1><p>Browse through our diverse range of meticulously crafted garments, designed to bring out your individuality.</p><a class="btn" href="#/shop">Shop Now</a><div class="stats"><div><b>200+</b>Brands</div><div><b>2,000+</b>Products</div><div><b>30,000+</b>Customers</div></div></div><img src="${IMG('photo-1617137968427-85924c800a22')}" alt=""></div>
 <div class="brands"><span>VERSACE</span><span>ZARA</span><span>GUCCI</span><span>PRADA</span><span>Calvin Klein</span></div>
 <div class="wrap"><section><h2 class="sec-t">New Arrivals</h2><div class="grid">${P.slice(0,4).map(card).join('')}</div><p style="text-align:center;margin-top:24px"><a class="btn o" href="#/shop">View All</a></p></section>
 <section><h2 class="sec-t">Top Selling</h2><div class="grid">${[...P].reverse().slice(0,4).map(card).join('')}</div></section>
 <section><div class="cats" style="display:block"><h2 class="sec-t">Browse by dress style</h2><div class="cats" style="padding:0;background:none">${[['Casual','photo-1521572163474-6864f9cf17ab'],['Formal','photo-1602810318383-e386cc2a3ccf'],['Party','photo-1620012253295-c15cc3e65df4'],['Gym','photo-1581009146145-b5ef050c2e1e']].map(c=>`<a class="cat" href="#/shop/${c[0]}" style="background-image:url(${IMG(c[1])})">${c[0]}</a>`).join('')}</div></div></section>
 <section><div class="sub"><h2>Stay upto date about our latest offers</h2><form onsubmit="subscribe(event)"><input name="e" type="email" required placeholder="Enter your email address"><button class="btn" style="background:#fff;color:#000">Subscribe to Newsletter</button></form></div></section></div>`,
 shop:cat=>{const l=cat?P.filter(p=>p.category===cat):P;return`<div class="wrap"><section><h2 class="sec-t">${esc(cat||'All Products')}</h2><div class="tabs" style="justify-content:center">${['All','Casual','Formal','Party','Gym'].map(c=>`<a class="btn o sm" href="#/shop${c=='All'?'':'/'+c}">${c}</a>`).join('')}</div><div class="grid">${l.map(card).join('')||'No products'}</div></section></div>`},
 product:id=>{const p=P.find(x=>x.id==id);if(!p)return'Not found';window.sel='M';return`<div class="wrap"><section class="two"><img src="${esc(p.image)}" style="width:100%;border-radius:20px" alt=""><div><h2 style="font-size:34px">${esc(p.title)}</h2><div class="price" style="margin:12px 0"><b style="font-size:28px">${inr(p.price)}</b>${p.mrp>p.price?`<s>${inr(p.mrp)}</s>`:''}</div><p style="color:var(--mut)">Premium cotton, comfortable fit. Easy ${C.RETURN_DAYS}-day returns.</p><div class="sz">${['S','M','L','XL'].map(s=>`<button class="${s=='M'?'on':''}" onclick="sel='${s}';document.querySelectorAll('.sz button').forEach(b=>b.classList.toggle('on',b.textContent==sel))">${s}</button>`).join('')}</div>${pinUI('ppin')}<button class="btn" onclick="add('${p.id}')">Add to Cart</button></div></section></div>`},
 cart:()=>{const t=totals();return`<div class="wrap"><section><h2 class="sec-t" style="text-align:left">Your Cart</h2>${cart.length?`<div class="two"><div class="box">${cart.map((c,i)=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><img src="${esc(c.image)}" width="80" style="border-radius:12px"><div style="flex:1"><b>${esc(c.title)}</b><br><small>Size ${c.size}</small><br>${inr(c.price)}</div><button class="btn o sm" onclick="qty(${i},-1)">−</button>${c.qty}<button class="btn o sm" onclick="qty(${i},1)">+</button></div>`).join('')}</div>
 <form class="box" onsubmit="checkout(event)"><h3>Order Summary</h3><p>Subtotal: ${inr(t.sub)}</p><p>Shipping: ${t.ship?inr(t.ship):'Free'}</p><p>GST (${C.GST_PERCENT}%) incl.: ${inr(t.gst)}</p><h3 style="margin:10px 0">Total ${inr(t.total)}</h3>
 <input name="name" required placeholder="Full name" value="${esc(window.prof?.name||user?.name||'')}" style="margin:4px 0"><input name="phone" required placeholder="Phone" value="${esc(window.prof?.phone||'')}" style="margin:4px 0"><textarea name="address" required placeholder="Address" style="margin:4px 0">${esc(window.prof?.address||'')}</textarea>${pinUI('cpin')}<button class="btn" style="width:100%">Pay with Razorpay</button></form></div>`:'<p>Cart khali hai. <a href="#/shop"><u>Shop</u></a></p>'}</section></div>`},
 orders:async()=>{if(!user)return'<div class="wrap"><section>Orders dekhne ke liye login karo.</section></div>';const o=await db.orders(),rs=await db.returns(),S=['Placed','Packed','Shipped','Out for Delivery','Delivered'];window._o=o;return`<div class="wrap"><section><h2 class="sec-t" style="text-align:left">My Orders</h2>${o.map(x=>{const i=S.indexOf(x.status),ret=rs.find(r=>r.order_id==x.id);return`<div class="box" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><b>#${String(x.id).slice(0,8)}</b><span class="tag">${esc(x.status)}</span><b>${inr(x.total)}</b></div><small>${(x.items||[]).map(c=>esc(c.title)+' ×'+c.qty).join(', ')}</small>${x.status=='Cancelled'?'':`<div class="steps">${S.map((s,j)=>`<div class="st ${j<=i?'on':''}"><i></i>${s}</div>`).join('')}</div>`}<div class="row"><button class="btn o sm" onclick="bill('${x.id}')">Download Bill</button>${x.status=='Delivered'&&!ret?`<button class="btn o sm" onclick="retReq('${x.id}')">Return</button>`:''}${ret?`<span class="tag">Return: ${esc(ret.status)}</span>`:''}</div></div>`}).join('')||'No orders yet'}</section></div>`},
 admin:async()=>{if(!isAdmin())return'<div class="wrap"><section>Admin access nahi hai.</section></div>';const[o,r,s]=await Promise.all([db.orders(1),db.returns(),db.subs()]),rev=o.filter(x=>x.status!='Cancelled').reduce((a,x)=>a+Number(x.total),0),OS=['Placed','Packed','Shipped','Out for Delivery','Delivered','Cancelled'];
 return`<div class="wrap"><section><h2 class="sec-t" style="text-align:left">Admin Dashboard</h2><div class="grid" style="margin-bottom:20px">${[['Revenue',inr(rev)],['Orders',o.length],['Returns',r.length],['Subscribers',s.length]].map(k=>`<div class="box"><small>${k[0]}</small><h3>${k[1]}</h3></div>`).join('')}</div>
 <h3>Orders</h3><div style="overflow:auto"><table><tr><th>ID</th><th>Customer</th><th>PIN</th><th>Total</th><th>Status</th></tr>${o.map(x=>`<tr><td>${String(x.id).slice(0,8)}</td><td>${esc(x.name)}<br><small>${esc(x.email)}</small></td><td>${esc(x.pin)}</td><td>${inr(x.total)}</td><td><select onchange="db.setOrder('${x.id}',this.value).then(()=>toast('Updated'))">${OS.map(z=>`<option ${z==x.status?'selected':''}>${z}</option>`).join('')}</select></td></tr>`).join('')}</table></div>
 <h3 style="margin-top:24px">Returns</h3><table>${r.map(x=>`<tr><td>${String(x.order_id).slice(0,8)}</td><td>${esc(x.reason)}</td><td><select onchange="db.setReturn('${x.id}',this.value).then(()=>toast('Updated'))">${['Requested','Approved','Pickup Scheduled','Refunded','Rejected'].map(z=>`<option ${z==x.status?'selected':''}>${z}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td>None</td></tr>'}</table>
 <h3 style="margin-top:24px">Add Product</h3><form class="row" style="flex-wrap:wrap" onsubmit="addProd(event)"><input name="title" placeholder="Title" required style="flex:2"><input name="price" type="number" placeholder="Price" required style="flex:1"><input name="mrp" type="number" placeholder="MRP" style="flex:1"><input name="image" placeholder="Image URL" required style="flex:2"><select name="category" style="flex:1"><option>Casual<option>Formal<option>Party<option>Gym</select><button class="btn">Add</button></form>
 <h3 style="margin-top:24px">Subscribers</h3><p>${s.map(x=>esc(x.email)).join(', ')||'None'}</p></section></div>`}
};
// ---------- ACTIONS ----------
const totals=()=>{const sub=cart.reduce((a,c)=>a+c.price*c.qty,0),ship=sub&&sub<C.FREE_SHIPPING_ABOVE?C.SHIPPING_FEE:0;return{sub,ship,gst:Math.round(sub*C.GST_PERCENT/(100+C.GST_PERCENT)),total:sub+ship}};
function add(id){const p=P.find(x=>x.id==id),k=cart.find(c=>c.id==id&&c.size==sel);k?k.qty++:cart.push({id,title:p.title,price:p.price,image:p.image,size:sel,qty:1});save();toast('Added to cart')}
function qty(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);save();route()}
async function subscribe(e){e.preventDefault();await db.addSub(e.target.e.value);e.target.reset();toast('Subscribed ✔')}
async function addProd(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.price=+f.price;f.mrp=+f.mrp||f.price;await db.addProduct(f);P=await db.products();toast('Product added');route()}
async function retReq(id){const reason=prompt('Return ka reason?');if(!reason)return;await db.addReturn({order_id:id,email:user.email,reason});toast('Return request bheji');route()}
async function checkout(e){e.preventDefault();if(!user){toast('Pehle login karo');return authClick()}
 const f=Object.fromEntries(new FormData(e.target)),pin=$('#cpin').value;if(!/^\d{6}$/.test(pin))return toast('Sahi pincode daalo');const t=totals();
 const done=async pid=>{const o=await db.addOrder({email:user.email,name:f.name,phone:f.phone,address:f.address,pin,items:cart,total:t.total,payment_id:pid,...(sb?{}:{})});await db.saveProfile({name:f.name,phone:f.phone,address:f.address,pin});cart=[];save();toast('Order placed ✔');location.hash='#/orders'};
 if(!C.RAZORPAY_KEY_ID)return toast('Razorpay Key ID config.js mein set nahi hai.');
 let order_id;try{if(!C.WORKER_URL.includes('your-worker')){order_id=(await(await fetch(C.WORKER_URL+'/razorpay/order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({amount:t.total*100})})).json()).id}}catch{}
 new Razorpay({key:C.RAZORPAY_KEY_ID,amount:t.total*100,currency:'INR',name:C.STORE_NAME,order_id,prefill:{name:f.name,email:user.email,contact:f.phone},handler:r=>done(r.razorpay_payment_id),theme:{color:'#000000'}}).open()}
async function bill(id){const o=(await db.orders(1)).find(x=>x.id==id),g=C.GST_PERCENT;const w=open('','_blank');w.document.write(`<title>Invoice</title><body style="font-family:Arial;max-width:700px;margin:30px auto"><h1>${C.STORE_NAME}</h1><h3>Tax Invoice #${String(o.id).slice(0,8)}</h3><p>Date: ${new Date(o.created_at).toLocaleDateString('en-IN')}<br>${esc(o.name)}, ${esc(o.phone)}<br>${esc(o.address)} - ${esc(o.pin)}</p><table border=1 cellpadding=8 style="border-collapse:collapse;width:100%"><tr><th>Item</th><th>Qty</th><th>Price</th><th>Amount</th></tr>${o.items.map(c=>`<tr><td>${esc(c.title)} (${c.size})</td><td>${c.qty}</td><td>${inr(c.price)}</td><td>${inr(c.price*c.qty)}</td></tr>`).join('')}</table><p>GST ${g}% included: ${inr(Math.round(o.total*g/(100+g)))}</p><h2>Total: ${inr(o.total)}</h2><p>Payment ID: ${esc(o.payment_id)}</p><script>print()<\/script>`)}
// ---------- ROUTER ----------
async function route(){const[,r,a]=location.hash.split('/');let h;if(r=='shop')h=V.shop(decodeURIComponent(a||''));else if(r=='p')h=V.product(a);else if(r=='cart'){window.prof=user?await db.profile():{};h=V.cart()}else if(r=='orders')h=await V.orders();else if(r=='admin')h=await V.admin();else h=V.home();$('#app').innerHTML=h;scrollTo(0,0);if(r=='cart'||r=='p')checkPin(r=='p'?'ppin':'cpin',(r=='p'?'ppin':'cpin')+'o')}
addEventListener('hashchange',route);
(async()=>{try{await initAuth();P=await db.products();save();setUser()}catch(e){console.error(e);P=[];$('#app').innerHTML=`<div class="wrap"><section class="box"><h2>Products load nahi hue</h2><p style="margin-top:10px">${esc(e.message||'Shopify connection failed')}</p><p style="margin-top:8px;color:var(--mut)">config.js mein Shopify domain aur Storefront API token check karo. Shopify Admin mein Storefront API access aur products Online Store/Storefront ke liye available hone chahiye.</p><button class="btn" style="margin-top:14px" onclick="location.reload()">Retry</button></section></div>`;}})();
</script></body></html>
